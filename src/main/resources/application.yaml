spring:
  application:
    name: line-bot


line:
  messaging:
    key-id: ${LINE_KID}
    channel-id: ${LINE_CHANNEL_ID}
    jwt-lifetime: 30m
    channel-token-lifetime: 1d

infisical:
  client-id: ${INFISICAL_CLIENT_ID}
  client-secret: ${INFISICAL_CLIENT_SECRET}
  project-id: ${INFISICAL_PROJECT_ID}
  environment: ${INFISICAL_ENVIRONMENT:dev}
  secret-path: /

client:
  line:
    api-base-url: ${LINE_BASE_URL:https://api.line.me}
    connect-timeout: ${LINE_CONNECT_TIMEOUT:3s}
    read-timeout: ${LINE_READ_TIMEOUT:3s}
